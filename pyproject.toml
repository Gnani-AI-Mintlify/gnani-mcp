[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnani-mcp"
version = "0.1.0"
description = "Official Gnani AI MCP server — Speech-to-Text, Text-to-Speech, and Voice Clone for Indian languages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gnani AI", email = "support@gnani.ai" }]
keywords = [
    "gnani", "vachana", "mcp", "model-context-protocol",
    "speech-to-text", "stt", "text-to-speech", "tts", "voice-clone",
    "indic", "indian-languages", "asr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.6",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4,<1.0",
    "mypy>=1.8",
]

[project.scripts]
gnani-mcp = "gnani_mcp.server:main"

[project.urls]
Homepage      = "https://gnani.ai"
Documentation = "https://docs.gnani.ai"
Repository    = "https://github.com/gnani-ai/gnani-mcp"
Issues        = "https://github.com/gnani-ai/gnani-mcp/issues"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/gnani_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gnani_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
    "B008",  # FastMCP / Pydantic Field() in defaults is idiomatic
    "A003",  # tool args use API-matching names like `format`, `language`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
python_files = ["test_*.py"]   # only collect test_*.py, not integration_test.py

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict         = true
ignore_missing_imports = true
